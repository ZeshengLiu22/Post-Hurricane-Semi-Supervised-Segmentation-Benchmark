# arguments for dataset
dataset: floodnet
nclass: 10
crop_size: 750
data_root: dataset/floodnet

# arguments for training
epochs: 150
batch_size: 4 # per GPU
num_workers: 4
val_num_workers: 4
pin_memory: true
prefetch_factor: 2
persistent_workers: true
eval_interval: 1
amp: true
amp_dtype: bfloat16
lr: 0.005
lr_multi: 1.0
criterion:
  name: CELoss
  kwargs:
    ignore_index: 255
conf_thresh: 0.95

# arguments for model
model: deeplabv3plus
backbone: resnet101
replace_stride_with_dilation: [False, False, True]
dilations: [6, 12, 18]
